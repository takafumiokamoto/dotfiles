[settings]
experimental = true
lockfile = true

[bootstrap.packages]
"apk:zsh" = "latest"
"apt:zsh" = "latest"
"dnf:zsh" = "latest"
"pacman:zsh" = "latest"

# C compiler
"apk:build-base" = "latest"
"apt:build-essential" = "latest"
"dnf:gcc" = "latest"
"pacman:gcc" = "latest"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.mise_shell_activate]
zprofile = true

### MacOS defaults ###
[bootstrap.macos.dock]
autohide = true
show_recents = false
orientation = "right"
tilesize = 40

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 5
initial_key_repeat = 25
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleAccentColor = 1
### MacOS defaults ###

[tools]
# Go
go = "latest"
"go:golang.org/x/tools/gopls" = { version = "latest", depends = "go" }
"go:github.com/go-delve/delve/cmd/dlv" = { version = "latest", depends = "go" }
golangci-lint = "latest"

# node
node = "latest"
"npm:@vtsls/language-server" = { version = "latest", depends = "node" }
"npm:vscode-json-languageserver" = { version = "latest", depends = "node" }
"npm:vscode-langservers-extracted" = { version = "latest", depends = "node" }
pnpm = "latest"
oxfmt = "latest"
oxlint = "latest"

# Python
python = "latest"
uv = "latest"
"npm:pyright" = { version = "latest", depends = "node" }
"pypi:debugpy" = { version = "latest", depends = "uv" }

# Rust
rust = "latest"
rust-analyzer = "latest"

# C (macOS uses Command Line Tools)
"conda:clang-tools" = { version = "latest", os = ["linux"] }
"conda:lldb" = { version = "latest", os = ["linux"] }

# Lua
lua-language-server = "latest"
stylua = "latest"

# shell
"npm:bash-language-server" = "latest"
shfmt = "latest"

# YAML
"npm:yaml-language-server" = { version = "latest", depends = "node" }

# terraform
terraform = "latest"
terraform-ls = "latest"

# tools
pinact = "latest"
tree-sitter = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
starship = "latest"
gh = "latest"
aws-cli = { version = "latest", symlink_bins = "true", os = ["linux", "macos"] }
task = "latest"
herdr = "latest"

# AI
codex = { version = "latest", minimum_release_age = "0d" }
claude = { version = "latest", minimum_release_age = "0d" }

[dotfiles]
"~/.config/mise" = { source = ".", mode = "symlink" }
"~/.config/nvim" = { source = "../nvim", mode = "symlink" }
"~/.config/wezterm" = { source = "../wezterm", mode = "symlink" }
"~/.config/kitty" = { source = "../kitty", mode = "symlink" }
"~/.config/neovide" = { source = "../neovide", mode = "symlink" }
"~/.config/starship" = { source = "../starship", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "../herdr/config.toml", mode = "symlink" }
"~/.config/karabiner" = { source = "../karabiner", mode = "symlink" }
"~/.config/amethyst" = { source = "../amethyst", mode = "symlink" }
"~/.clang-format" = { source = "../clang-format/.clang-format", mode = "symlink" }
"~/.editorconfig" = { source = "../editorconfig/.editorconfig", mode = "symlink" }
"~/.config/git/ignore" = { source = "../git/ignore", mode = "symlink" }
"~/.gitconfig" = { source = "../git/.gitconfig", mode = "copy", create_if_missing = true }

# zsh
"~/.zshenv" = { source = "../zsh/.zshenv", mode = "symlink" }
"~/.zshrc" = { source = "../zsh/.zshrc", mode = "symlink" }
"~/.aliases.zsh" = { source = "../zsh/.aliases.zsh", mode = "symlink" }
"~/.hushlogin" = { source = "../zsh/.hushlogin", mode = "symlink" }
"~/.zprofile/homebrew" = { line = '[[ -x /opt/homebrew/bin/brew ]] && eval "$(/opt/homebrew/bin/brew shellenv)"', position = "prepend" }

